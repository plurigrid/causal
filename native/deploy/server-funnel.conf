# Use only behind a TLS-terminating local proxy such as Tailscale Funnel.
# The launch configuration MUST bind CAUSAL_LISTEN to a loopback address.
server_name: "causal-funnel"
listen: $CAUSAL_LISTEN

max_payload: 1MB
max_connections: 4096
max_subscriptions: 256
write_deadline: "10s"

jetstream {
  store_dir: $CAUSAL_STORE_DIR
  max_mem: 256MB
  max_file: 10GB
}

include ./users.conf
