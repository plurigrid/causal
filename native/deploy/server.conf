server_name: "causal"
listen: $CAUSAL_LISTEN

max_payload: 1MB
max_connections: 4096
max_subscriptions: 256
write_deadline: "10s"

tls {
  cert_file: $CAUSAL_TLS_CERT
  key_file: $CAUSAL_TLS_KEY
  ca_file: $CAUSAL_TLS_CA
  handshake_first: true
  timeout: 2
  min_version: "1.2"
}

jetstream {
  store_dir: $CAUSAL_STORE_DIR
  max_mem: 256MB
  max_file: 10GB
}

include ./users.conf
