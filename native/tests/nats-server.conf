server_name: "causal-test"
listen: $NATS_TEST_LISTEN

tls {
  cert_file: $NATS_TEST_CERT
  key_file: $NATS_TEST_KEY
  ca_file: $NATS_TEST_CA
  handshake_first: true
  timeout: 2
}

jetstream {
  store_dir: $NATS_TEST_STORE
  max_mem: 64M
  max_file: 256M
}

authorization {
  users: [
    {
      user: "admin"
      password: $NATS_ADMIN_PASS
      permissions: { publish: ">", subscribe: ">" }
    }
    {
      user: "alice"
      password: $NATS_ALICE_PASS
      permissions: {
        publish: ["chat.room.*", "chat.dm.*.alice", "$JS.API.CONSUMER.MSG.NEXT.CAUSAL.alice"]
        subscribe: ["chat.room.*", "chat.dm.alice.*", "_INBOX.CAUSAL.alice.>"]
        allow_responses: { max: 1, expires: "10s" }
      }
    }
    {
      user: "bob"
      password: $NATS_BOB_PASS
      permissions: {
        publish: ["chat.room.*", "chat.dm.*.bob", "$JS.API.CONSUMER.MSG.NEXT.CAUSAL.bob"]
        subscribe: ["chat.room.*", "chat.dm.bob.*", "_INBOX.CAUSAL.bob.>"]
        allow_responses: { max: 1, expires: "10s" }
      }
    }
  ]
}
